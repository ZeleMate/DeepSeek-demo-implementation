# uv at one pinned version, from its verified release archive, for the CI tools in .github/tools.
# astral-sh/setup-uv isn't on this repo's Actions allowlist. Bump the version and SHA-256 together;
# Dependabot doesn't track them. Callers run "$RUNNER_TEMP/uv": it stays off PATH, so no step
# writes to $GITHUB_PATH.
name: uv
description: Install uv 0.13.3 from its verified release archive as "$RUNNER_TEMP/uv".
runs:
  using: composite
  steps:
    - shell: bash
      env:
        UV_VERSION: "0.13.3"
        UV_SHA256: "e4f169ec380f1793b898a6f1fcbacd22db25cf7ca0349a6e96ffb85b69998d04"
      run: |
        curl -fsSL --proto '=https' --proto-redir '=https' --retry 3 -o "$RUNNER_TEMP/uv.tgz" "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-x86_64-unknown-linux-gnu.tar.gz"
        echo "${UV_SHA256}  $RUNNER_TEMP/uv.tgz" | sha256sum -c -
        tar -xzf "$RUNNER_TEMP/uv.tgz" -C "$RUNNER_TEMP" --strip-components=1 uv-x86_64-unknown-linux-gnu/uv
