version: 2
updates:
  # CI-only tools (.github/tools/uv.lock), locked apart from the app.
  - package-ecosystem: uv
    directory: /.github/tools
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      ci-tools:
        patterns: ["*"]
    commit-message:
      prefix: ci

  # Keeps the SHA pins in .github/workflows current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Third-party actions wait 7 days. The central workflows are our own, so they don't.
    cooldown:
      default-days: 7
      exclude: ["ZeleMate/workflows*"]
    groups:
      # Apart from `actions`, so a red central bump doesn't block unrelated updates.
      central-workflows:
        patterns: ["ZeleMate/workflows*"]
      actions:
        patterns: ["*"]
        exclude-patterns: ["ZeleMate/workflows*"]
    ignore:
      # A major central release needs caller edits, so it arrives with a template update.
      - dependency-name: "ZeleMate/workflows*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: ci

  # dsh moves one release candidate per PR with the $0 upgrade check (ADR 0001), so
  # Dependabot leaves it alone; the rest of the workspace gets grouped updates.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 14
    ignore:
      - dependency-name: "@deepseek-ai/*"
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: build
