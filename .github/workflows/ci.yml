name: CI

# Same checks as the git hooks (lefthook.yml), so --no-verify can't skip them.
# The commit-msg check runs on the PR title, which becomes the squash commit.
# Every action is pinned to a full commit SHA; Dependabot keeps the pins current.

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: secrets (gitleaks, full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (checksum-verified)
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks && rm gitleaks.tgz
      - name: Scan every commit
        run: ./gitleaks git --redact --no-banner --log-opts=--all

  repo-rules:
    name: forbidden paths and commands
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: git ls-files -z | xargs -0 scripts/checks/forbidden-paths.sh
      - run: git ls-files -z | xargs -0 scripts/checks/forbidden-patterns.sh
      - run: git ls-files -z | xargs -0 scripts/checks/file-hygiene.sh
      - name: shellcheck
        run: git ls-files -z 'bin/*' 'scripts/**.sh' | xargs -0 --no-run-if-empty shellcheck

  pr-title:
    name: PR title (conventional commit)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | scripts/checks/commit-message.sh

  markdown:
    name: markdown
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: "**/*.md"

  workflows:
    name: workflows (actionlint, zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint (checksum-verified)
        run: |
          curl -sSfL -o actionlint.tgz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tgz" | sha256sum -c -
          tar -xzf actionlint.tgz actionlint && rm actionlint.tgz
      - run: ./actionlint -color
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          # No GitHub Advanced Security on this private repo: print findings instead of uploading SARIF.
          advanced-security: false
          version: 1.31.1

  claude-security:
    name: security review (Claude)
    # Same-repo PRs only: the action isn't hardened against prompt injection from untrusted diffs.
    # Dependabot PRs can't read Actions secrets.
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write # comments findings on the PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      # No release tags upstream, so this pins a main commit. Note it installs the latest
      # @anthropic-ai/claude-code from npm on every run; that part isn't pinned.
      - uses: anthropics/claude-code-security-review@0c6a49f1fa56a1d472575da86a94dbc1edb78eda # main, 2026-02-11
        with:
          claude-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude-model: claude-sonnet-5-5
          # By default it reviews only a PR's first commit; a gate has to see every push.
          run-every-commit: true
      # The action reports 0 findings when the scan errors, so check the results file, not its output.
      - name: Fail on findings or an incomplete review
        run: |
          f=claudecode-results.json
          if [ ! -s "$f" ]; then echo "::error::no results file: the review didn't run"; exit 1; fi
          if jq -e '.error' "$f" >/dev/null; then echo "::error::review failed: $(jq -r '.error' "$f")"; exit 1; fi
          if jq -e '.analysis_summary.review_completed == false' "$f" >/dev/null; then
            echo "::error::review incomplete: Claude's output couldn't be parsed"; exit 1
          fi
          n=$(jq '.findings | length' "$f")
          if [ "$n" -gt 0 ]; then
            jq -r '.findings[] | "::error file=\(.file),line=\(.line // 1)::[\(.severity)] \(.description // .category)"' "$f"
            exit 1
          fi
          echo "No findings."
