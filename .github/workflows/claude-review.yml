name: Claude code review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

jobs:
  review:
    permissions:
      contents: read
      pull-requests: write
      issues: read
    # Pinned to a commit: this job receives CLAUDE_CODE_OAUTH_TOKEN, so a moved @main must not change what runs.
    uses: ZeleMate/.github/.github/workflows/claude-review.yml@f720600699c0c2abf7f9e8aa359c961ca8f2515d # TEMP: testing ZeleMate/.github#3
    with:
      debug: true # TEMP
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
