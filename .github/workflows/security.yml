name: Security

# Called from ci.yml on every PR/push (so it feeds the ci-ok check), and run weekly
# so new advisories against unchanged code are caught. Gitleaks runs in ci.yml's own
# `secrets` job, which ci-ok requires.
# Code scanning is CodeQL default setup, a repo setting, not a job here.
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1"

permissions: {}

jobs:
  dependencies:
    name: dependencies (osv-scanner)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      OSV_VERSION: "2.7.0"
      OSV_SHA256: "160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install osv-scanner (checksum-verified)
        run: |
          curl -fsSL --proto '=https' --proto-redir '=https' -o osv-scanner "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
      - run: ./osv-scanner scan source --recursive .
