name: Security

# Called from ci.yml on every PR/push (so it feeds the ci-ok check), and run weekly
# so new advisories against unchanged code are caught. Gitleaks runs in ci.yml's own
# `secrets` job, which the rulesets require by name.
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1"

permissions: {}

env:
  UV_LOCKED: "1"

jobs:
  sast:
    name: sast (semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      UV_VERSION: "0.13.3"
      UV_SHA256: "e4f169ec380f1793b898a6f1fcbacd22db25cf7ca0349a6e96ffb85b69998d04"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # astral-sh/setup-uv isn't on this repo's Actions allowlist, so install uv like the other CI tools.
      - name: Install uv (checksum-verified)
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/uv.tgz" "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-x86_64-unknown-linux-gnu.tar.gz"
          echo "${UV_SHA256}  $RUNNER_TEMP/uv.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/uv.tgz" -C "$RUNNER_TEMP" --strip-components=1 uv-x86_64-unknown-linux-gnu/uv
      # Semgrep Community Edition runs entirely in CI; no code leaves the runner except rule downloads.
      # Add project rules under .semgrep/ and they are picked up automatically.
      - env:
          # semgrep-core can segfault in its io_uring backend on ubuntu-24.04
          # runners; Eio's portable backend avoids it.
          EIO_BACKEND: posix
        run: |
          configs=(--config p/default)
          [ -d .semgrep ] && configs+=(--config .semgrep)
          "$RUNNER_TEMP/uv" run --project .github/tools semgrep scan "${configs[@]}" --error --metrics off --disable-version-check
    # CodeQL runs via GitHub "default setup" (enabled by scripts/bootstrap-github.sh), not in this file.

  dependencies:
    name: dependencies (osv-scanner)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      OSV_VERSION: "2.7.0"
      OSV_SHA256: "160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install osv-scanner (checksum-verified)
        run: |
          curl -fsSL -o osv-scanner "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
      - run: ./osv-scanner scan source --recursive .
