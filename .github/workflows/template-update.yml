name: Template update check

# Opens an issue when the Copier template has a newer tagged version.
# If the template repo is private, add a TEMPLATE_READ_TOKEN secret (fine-grained, contents:read on it).
on:
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      UV_VERSION: "0.13.3"
      UV_SHA256: "e4f169ec380f1793b898a6f1fcbacd22db25cf7ca0349a6e96ffb85b69998d04"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # astral-sh/setup-uv isn't on this repo's Actions allowlist, so install uv like the other CI tools.
      - name: Install uv (checksum-verified)
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/uv.tgz" "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-x86_64-unknown-linux-gnu.tar.gz"
          echo "${UV_SHA256}  $RUNNER_TEMP/uv.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/uv.tgz" -C "$RUNNER_TEMP" --strip-components=1 uv-x86_64-unknown-linux-gnu/uv
      - name: Check for template update
        env:
          GH_TOKEN: ${{ github.token }}
          TEMPLATE_READ_TOKEN: ${{ secrets.TEMPLATE_READ_TOKEN }}
        run: |
          if [ -n "$TEMPLATE_READ_TOKEN" ]; then
            git config --global url."https://x-access-token:${TEMPLATE_READ_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi
          set +e
          UV_LOCKED=1 "$RUNNER_TEMP/uv" run --project .github/tools copier check-update --quiet
          rc=$?
          set -e
          if [ "$rc" -eq 2 ]; then
            title="Repo template update available"
            if [ -z "$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[].number')" ]; then
              gh issue create --title "$title" --body "Run \`uvx copier update --trust\` locally, review the diff, and open a PR."
            fi
          elif [ "$rc" -ne 0 ]; then
            echo "copier check-update failed (rc=$rc)"; exit "$rc"
          fi
