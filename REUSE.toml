version = 1

[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "Zelenyiánszki Máté"
SPDX-License-Identifier = "MIT"

# Copied verbatim from dsh's workspace at dsh-v0.2.2-rc.1, and it changes pi-ai's code.
# Both are MIT. The holders come from pi-ai's package.json author and dsh's LICENSE.
[[annotations]]
path = "patches/@earendil-works__pi-ai@1.3.0.patch"
precedence = "override"
SPDX-FileCopyrightText = ["Mario Zechner", "2026 DeepSeek"]
SPDX-License-Identifier = "MIT"

# Generated by scripts/upgrade-check/check.sh from dsh's own config, with our bundle's rows. The
# resume fixture is a session log, so it also carries dsh's system prompt and tool descriptions.
[[annotations]]
path = ["scripts/upgrade-check/snapshots/**", "scripts/upgrade-check/resume/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = ["2026 DeepSeek", "Zelenyiánszki Máté"]
SPDX-License-Identifier = "MIT"
