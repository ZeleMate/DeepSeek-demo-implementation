# PROTOTYPE (#104). The improver's harnessing profile, applied after @deepseek-ai/dsh-base and
# @deepseek-ai/dsh-headless. Starts from bundles/redteam's hardening and takes away more: the
# improver gets exactly three tools, all ours (list_run_files, read_run_file, submit_edits).

# Model: local for the prototype, so an injected trace never reaches a remote provider. The
# real improver model is #105's decision; its key would come from bin/dsh-harnessing only.
- id: llm-pi-ai
  config:
    providers:
      ollama:
        displayName: Local Ollama
        api: openai-completions
        baseURL: http://127.0.0.1:11434/v1
        apiKeyEnv: OLLAMA_DUMMY_KEY
        compat:
          maxTokensField: max_tokens
          supportsStore: false
          supportsDeveloperRole: false
        defaultContextWindow: 16384
        models:
          - id: harnessing-qwen3.5-4b-16k
            contextWindow: 16384
            maxTokens: 4096
- id: agent-default-model
  config:
    provider: ollama
    model: harnessing-qwen3.5-4b-16k
- id: llm-deepseek
  disabled: true
- id: llm-deepseek-account
  disabled: true
- id: deepseek-llm-api-extensions
  disabled: true
- id: plugin-package-inventory-deepseek
  disabled: true
- id: deepseek-account
  disabled: true

- id: session-persistence-jsonl
  config:
    root: !!js dshHomePath('sessions')
    compression: none
- id: session-telemetry-otel
  disabled: true
- id: session-log-deepseek
  disabled: true
- id: session-title-llm
  disabled: true

# No web at all: the improver needs nothing from outside the run directory.
- id: web
  disabled: true
- id: tool-web
  disabled: true
- id: web-search-deepseek
  disabled: true
- id: web-deepseek-api
  disabled: true
- id: web-fetch-http
  disabled: true

# No file tools of dsh's own. dsh-fs-sandbox fences writes only; reads are unconfined in every
# sandbox mode, so read/glob/grep could open ~/.ssh or another profile's home. Our plugin's
# read_run_file is confined to the run directory instead.
- id: tool-fs
  disabled: true
- id: tool-fs-search
  disabled: true

# Nothing else the model can call: no todo list, no cwd change, no questions (headless, nobody
# answers), no plan mode, no MCP.
- id: tool-todo
  disabled: true
- id: tool-working-directory
  disabled: true
- id: user-questions
  disabled: true
- id: plan-mode
  disabled: true
- id: mcp-resources
  disabled: true

# The shell, async, subagent, AgentTeam, PTC and goal rows, as in bundles/redteam.
- id: jobs
  disabled: true
- id: tool-jobs
  disabled: true
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
# bash-sandbox stays on, as in bundles/redteam: it is no tool, and it provides the shell service
# the permission row waits for. Turned off, permission stays pending and its read-only preset
# never applies (found in this prototype).
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: subagent
  disabled: true
- id: subagent-fork-in-process
  disabled: true
- id: subagent-spawn-in-process
  disabled: true
- id: agent-team
  disabled: true
- id: tool-agent-team
  disabled: true
- id: workflow-ptc
  disabled: true
- id: tool-workflow
  disabled: true
- id: goal
  disabled: true
- id: goal-round-driver
  disabled: true
- id: command-goal
  disabled: true
- id: tool-goal
  disabled: true
- id: ptc-runtime
  disabled: true
- id: tool-executor-ptc
  disabled: true

- id: sandbox-policy
  config:
    mode: read-only
    workspaceRoot: !!js process.cwd()
- id: approval
  config:
    policy: ask
- id: permission
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
- id: fs-observation-policy
  disabled: false

# No instructions or skills from disk: the improver's own instructions come with its prompt.
- id: agent-instructions
  disabled: true
- id: skill
  disabled: true
- id: skill-filesystem
  disabled: true
- id: tool-skill
  disabled: true
- id: plugin-manager
  disabled: true
- id: tool-plugin-manager
  disabled: true

- insert:
    - id: zelemate-improver
      name: '@zelemate/dsh-improver'
      config:
        runDir: !!js process.env.DSH_DEMO_ROOT + '/harnessing/run'
