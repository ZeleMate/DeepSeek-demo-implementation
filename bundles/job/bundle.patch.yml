# The job profile's layer, applied after @deepseek-ai/dsh-base and @deepseek-ai/dsh-headless.
# Not named cordis.patch.yml: that name is reserved for user-owned profile layers, which
# .gitignore and scripts/checks/forbidden-paths.sh keep out of the repo (ADR 0007).
# A patch replaces a row's whole config, so every overridden row restates all of its keys.
# Base rows overridden here (re-check each on a dsh upgrade, ADR 0001): llm-pi-ai,
# agent-default-model, session-persistence-jsonl, sandbox-policy, approval, and the disabled
# rows below.

# Models (ADR 0006). DeepSeek V4.1 Flash is the everyday model; the Switchyard preset
# escalates hard turns to Opus 5.5. Router ids need maxTokens raised from 4,096, and Opus
# behind a router id needs Anthropic-format cache control to keep prompt caching.
- id: llm-pi-ai
  config:
    providers:
      openrouter:
        displayName: OpenRouter
        api: openai-completions
        baseURL: https://openrouter.ai/api/v1
        apiKeyEnv: OPENROUTER_API_KEY
        models:
          - id: deepseek/deepseek-v4.1-flash
            contextWindow: 200000
            maxTokens: 8192
      openrouter-switchyard:
        displayName: OpenRouter Switchyard preset
        api: openai-completions
        baseURL: https://openrouter.ai/api/v1
        apiKeyEnv: OPENROUTER_API_KEY
        compat:
          cacheControlFormat: anthropic
        models:
          - id: "@preset/dsh-switchyard"
            contextWindow: 200000
            maxTokens: 8192

- id: agent-default-model
  config:
    provider: openrouter
    model: deepseek/deepseek-v4.1-flash

# Session log kept uncompressed so the audit can read it (ADR 0003).
- id: session-persistence-jsonl
  config:
    root: !!js dshHomePath('sessions')
    compression: none

# Telemetry off (ADR 0003): a triggered upload sends the whole session unredacted.
# The launcher also exports DSH_TELEMETRY_DISABLED=1 as a second lock.
- id: session-telemetry-otel
  disabled: true
- id: session-log-deepseek
  disabled: true

# The per-session title call runs on the main route without being logged (ADR 0005).
- id: session-title-llm
  disabled: true

# No search or fetch in the job profile (ADR 0008). dsh's search and fetch rows send
# queries to DeepSeek's API with DEEPSEEK_API_KEY.
- id: tool-web
  disabled: true
- id: web
  disabled: true
- id: web-search-deepseek
  disabled: true
- id: web-deepseek-api
  disabled: true
- id: web-fetch-http
  disabled: true

# No async tools (ADR 0003, ADR 0013, #121). In dsh rc.2 a background job's output and a
# subagent's answer reach the model later, as a user message in a new turn: no tool hook
# sees a subagent's answer, and per-turn taint is gone by then. Bash and PTC go with them.
# Goal rounds re-send a model-written objective the same way, so a goal set under
# injection would come back every round.
- id: jobs
  disabled: true
- id: tool-jobs
  disabled: true
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: workflow-ptc
  disabled: true
- id: tool-workflow
  disabled: true
- id: goal
  disabled: true
- id: goal-round-driver
  disabled: true
- id: command-goal
  disabled: true
- id: tool-goal
  disabled: true

# PTC runs model-written programs, and dsh's sandbox limits file writes only (ADR 0003).
- id: ptc-runtime
  disabled: true

# No direct DeepSeek route (ADR 0005): every model request goes through llm-pi-ai above.
# These rows send requests, model listings and our plugin inventory to api.deepseek.com.
# deepseek-account is already off in headless; it is restated so an upgrade can't turn it on.
- id: llm-deepseek
  disabled: true
- id: llm-deepseek-account
  disabled: true
- id: plugin-package-inventory-deepseek
  disabled: true
- id: deepseek-llm-api-extensions
  disabled: true
- id: deepseek-account
  disabled: true

# Read-only and fixed here, so DSH_PERMISSION_MODE can't widen it (ADR 0003). An escalation
# asks, and in a headless run nobody can answer, so it is denied.
- id: sandbox-policy
  config:
    mode: read-only
    workspaceRoot: !!js process.cwd()
- id: approval
  config:
    policy: ask

# No file tools until the read allowlist lands (M4, ADR 0012). Reads are unconfined, and this
# profile's model is remote, so anything a file tool could read would go to OpenRouter.
- id: tool-fs
  disabled: true
- id: tool-fs-search
  disabled: true

# No instructions or skills from disk (ADR 0009, ADR 0010, ADR 0012). These rows read AGENTS.md,
# CLAUDE.md and skills from the working directory and the home folders, so a file left by one
# run, or one in a scanned repo, would steer the next.
- id: agent-instructions
  disabled: true
- id: skill
  disabled: true
- id: skill-filesystem
  disabled: true
- id: tool-skill
  disabled: true

# Only our own plugins load (ADR 0012). The plugin market isn't in base or headless.
- id: plugin-manager
  disabled: true
- id: tool-plugin-manager
  disabled: true

- insert:
    - id: zelemate-hello
      name: '@zelemate/dsh-hello'
