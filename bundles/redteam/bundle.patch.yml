# The red-team profile's layer, applied after @deepseek-ai/dsh-base and @deepseek-ai/dsh-headless.
# Not named cordis.patch.yml: that name is reserved for user-owned profile layers (ADR 0007).
# A patch replaces a row's whole config, so every overridden row restates all of its keys.
# Base rows overridden here (re-check each on a dsh upgrade, ADR 0001): llm-pi-ai,
# agent-default-model, session-persistence-jsonl, and the disabled rows below.

# Models (ADR 0005). Local Ollama only, with no remote route and no fallback of any kind:
# providers forbid injection and jailbreak testing against their models. The tags are
# created by bin/dsh-redteam from the Modelfiles next to this file (16k context, #26).
# Ollama needs no key, but pi-ai's OpenAI-compatible transport requires one, so the
# launcher sets a dummy value that is not a secret (ADR 0007).
- id: llm-pi-ai
  config:
    providers:
      ollama:
        displayName: Local Ollama
        api: openai-completions
        baseURL: http://127.0.0.1:11434/v1
        apiKeyEnv: OLLAMA_DUMMY_KEY
        compat:
          maxTokensField: max_tokens
          supportsStore: false
          supportsDeveloperRole: false
        defaultContextWindow: 16384
        models:
          - id: redteam-qwen3.5-4b-16k
            contextWindow: 16384
            maxTokens: 2048
          - id: redteam-granite4.2-3b-16k
            contextWindow: 16384
            maxTokens: 2048

- id: agent-default-model
  config:
    provider: ollama
    model: redteam-qwen3.5-4b-16k

# dsh's own DeepSeek routes stay registered in base even without a key. Disabled, so no
# request can reach DeepSeek's API, and so dumped config shows no remote route (#56).
- id: llm-deepseek
  disabled: true
- id: llm-deepseek-account
  disabled: true
- id: deepseek-llm-api-extensions
  disabled: true
- id: plugin-package-inventory-deepseek
  disabled: true

# Session log kept uncompressed so the deterministic checks can read it (ADR 0003, 0011).
- id: session-persistence-jsonl
  config:
    root: !!js dshHomePath('sessions')
    compression: none

# Telemetry off (ADR 0003): a triggered upload sends the whole session unredacted.
# The launcher also exports DSH_TELEMETRY_DISABLED=1 as a second lock.
- id: session-telemetry-otel
  disabled: true
- id: session-log-deepseek
  disabled: true

# The per-session title call would add an unlogged model call to every attack (ADR 0005).
- id: session-title-llm
  disabled: true

# No dsh search or fetch: they send queries to DeepSeek's API or the public web. Red-team
# runs get fixture search and fetch providers instead (ADR 0008, #47, #60).
- id: tool-web
  disabled: true
- id: web
  disabled: true
- id: web-search-deepseek
  disabled: true
- id: web-deepseek-api
  disabled: true
- id: web-fetch-http
  disabled: true

# No async tools (ADR 0003, ADR 0013, #121). In dsh rc.2 a background job's output and a
# subagent's answer reach the model later, as a user message in a new turn: no tool hook
# sees a subagent's answer, and per-turn taint is gone by then. Bash and PTC go with them.
- id: jobs
  disabled: true
- id: tool-jobs
  disabled: true
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: workflow-ptc
  disabled: true
- id: tool-workflow
  disabled: true

# Only our own plugins load (ADR 0012). The plugin market isn't in base or headless.
- id: plugin-manager
  disabled: true
- id: tool-plugin-manager
  disabled: true
