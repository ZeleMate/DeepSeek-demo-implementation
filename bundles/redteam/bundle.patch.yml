# The red-team profile's layer, applied after @deepseek-ai/dsh-base and @deepseek-ai/dsh-headless.
# Not named cordis.patch.yml: that name is reserved for user-owned profile layers (ADR 0007).
# A patch replaces a row's whole config, so every overridden row restates all of its keys.
# Base rows overridden here (re-check each on a dsh upgrade, ADR 0001): llm-pi-ai,
# agent-default-model, session-persistence-jsonl, sandbox-policy, approval, permission,
# fs-observation-policy, and the disabled rows below.

# Models (ADR 0005). Local Ollama only, with no remote route and no fallback of any kind:
# providers forbid injection and jailbreak testing against their models. The tags are
# created by bin/dsh-redteam from the Modelfiles next to this file (16k context, #26).
# Ollama needs no key, but pi-ai's OpenAI-compatible transport requires one, so the
# launcher sets a dummy value that is not a secret (ADR 0007).
- id: llm-pi-ai
  config:
    providers:
      ollama:
        displayName: Local Ollama
        api: openai-completions
        baseURL: http://127.0.0.1:11434/v1
        apiKeyEnv: OLLAMA_DUMMY_KEY
        compat:
          maxTokensField: max_tokens
          supportsStore: false
          supportsDeveloperRole: false
        defaultContextWindow: 16384
        models:
          - id: redteam-qwen3.5-4b-16k
            contextWindow: 16384
            maxTokens: 2048
          - id: redteam-granite4.2-3b-16k
            contextWindow: 16384
            maxTokens: 2048

- id: agent-default-model
  config:
    provider: ollama
    model: redteam-qwen3.5-4b-16k

# dsh's own DeepSeek routes stay registered in base even without a key. Disabled, so no
# request can reach DeepSeek's API, and so dumped config shows no remote route (#56).
- id: llm-deepseek
  disabled: true
- id: llm-deepseek-account
  disabled: true
- id: deepseek-llm-api-extensions
  disabled: true
- id: plugin-package-inventory-deepseek
  disabled: true
# Already off in headless; restated so an upgrade can't turn it on.
- id: deepseek-account
  disabled: true

# Session log kept uncompressed so the deterministic checks can read it (ADR 0003, 0011).
- id: session-persistence-jsonl
  config:
    root: !!js dshHomePath('sessions')
    compression: none

# Telemetry off (ADR 0003): a triggered upload sends the whole session unredacted.
# The launcher also exports DSH_TELEMETRY_DISABLED=1 as a second lock.
- id: session-telemetry-otel
  disabled: true
- id: session-log-deepseek
  disabled: true

# The per-session title call would add an unlogged model call to every attack (ADR 0005).
- id: session-title-llm
  disabled: true

# No dsh search or fetch: they send queries to DeepSeek's API or the public web, and since
# dsh 0.2.2 web-fetch-http also reaches loopback, private and metadata addresses, Ollama's API
# included (#47). web_fetch here is served by our fixture fetch provider, which reads its pages
# from disk and answers 404 to every other URL (ADR 0008). The web row pins it, so if our plugin
# fails to load, every fetch fails with WEB_PROVIDER_CONFIGURED_MISSING instead of picking another
# provider (ADR 0003). web_search stays off until the fixture search provider lands (#60).
- id: web
  disabled: false
  config:
    fetchProvider: fixture
- id: tool-web
  disabled: false
  config:
    search: false
    fetch: true
- id: web-search-deepseek
  disabled: true
- id: web-deepseek-api
  disabled: true
- id: web-fetch-http
  disabled: true

# Keep the shell, async, PTC, sandbox and instruction rows below in step with bundles/job:
# both hardened profiles turn off the same ones.

# No async tools (ADR 0003, ADR 0013, #121). In dsh rc.2 a background job's output and a
# subagent's answer reach the model later, as a user message in a new turn: no tool hook
# sees a subagent's answer, and per-turn taint is gone by then. Bash and PTC go with them.
# Goal rounds re-send a model-written objective the same way, so a goal set under
# injection would come back every round.
- id: jobs
  disabled: true
- id: tool-jobs
  disabled: true
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-subagent-control
  disabled: true
# AgentTeam (dsh 0.2.2-rc.2) adds a durable task board shared across a subagent tree.
- id: agent-team
  disabled: true
- id: tool-agent-team
  disabled: true
- id: workflow-ptc
  disabled: true
- id: tool-workflow
  disabled: true
- id: goal
  disabled: true
- id: goal-round-driver
  disabled: true
- id: command-goal
  disabled: true
- id: tool-goal
  disabled: true

# PTC runs model-written programs, and dsh's sandbox limits file writes only (ADR 0003). With
# bash and PTC off, a jailbroken victim has no way to the Keychain or the network (ADR 0002).
- id: ptc-runtime
  disabled: true
# dsh 0.2.2 moved PTC execution into its own row. Off by default, restated so an upgrade
# can't turn it on.
- id: tool-executor-ptc
  disabled: true

# Read-only and fixed here (ADR 0003). An escalation asks, and in a headless run nobody can
# answer, so it is denied.
- id: sandbox-policy
  config:
    mode: read-only
    workspaceRoot: !!js process.cwd()
- id: approval
  config:
    policy: ask
# The only permission preset (ADR 0003). Since dsh 0.2.2, headless takes --permission-mode on
# the command line and applies that preset over the sandbox row above, so with dsh's presets
# `--permission-mode danger-full-access` ran this profile with full access. With read-only
# as the only preset, any other name is refused.
- id: permission
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
# Read-before-write (ADR 0003). dsh 0.2.2 ships this row off, so write and edit no longer need
# a prior read of the file. Turned back on so an upgrade doesn't loosen a hardened profile.
- id: fs-observation-policy
  disabled: false

# No instructions or skills from disk (ADR 0009, ADR 0010, ADR 0012). These rows read AGENTS.md,
# CLAUDE.md and skills from the working directory and the home folders, so a file left by one
# attack would steer the next and skew its score (ADR 0011).
- id: agent-instructions
  disabled: true
- id: skill
  disabled: true
- id: skill-filesystem
  disabled: true
- id: tool-skill
  disabled: true

# Only our own plugins load (ADR 0012). The plugin market isn't in base or headless.
- id: plugin-manager
  disabled: true
- id: tool-plugin-manager
  disabled: true

- insert:
    - id: zelemate-web-fixture
      name: '@zelemate/dsh-web-fixture'
