# Git hooks. Install the tools with `brew bundle`, then run `lefthook install` once.
# CI runs the same checks (.github/workflows/ci.yml), so --no-verify only delays a failure;
# no-push-to-main is enforced by the "Protect main" ruleset instead.
# Local overrides go in lefthook-local.yml (gitignored).

pre-commit:
  parallel: true
  commands:
    secrets:
      run: gitleaks git --staged --redact --no-banner
    forbidden-paths:
      run: scripts/checks/forbidden-paths.sh {staged_files}
    forbidden-patterns:
      run: scripts/checks/forbidden-patterns.sh {staged_files}
    file-hygiene:
      run: scripts/checks/file-hygiene.sh {staged_files}
    markdown:
      glob: "*.md"
      run: markdownlint-cli2 {staged_files}
    workflows:
      # "**/" needs at least one folder, so the top-level .github/dependabot.yml is listed separately.
      glob:
        - ".github/*.{yml,yaml}"
        - ".github/**/*.{yml,yaml}"
      # Offline here (no token needed); CI runs zizmor online with a pinned version.
      run: actionlint && zizmor --no-progress --offline .github/
    shell:
      glob: "{bin/*,scripts/**/*.sh}"
      run: shellcheck {staged_files}

commit-msg:
  commands:
    conventional:
      run: scripts/checks/commit-message.sh {1}

pre-push:
  commands:
    push-checks:
      # Refuses pushes to main; scans the commits each pushed ref adds, whichever branch it is.
      run: scripts/checks/pre-push.sh
      use_stdin: true
