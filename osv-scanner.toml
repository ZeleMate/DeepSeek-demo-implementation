# OSV-Scanner's accept list (security.yml's `dependencies` job). Every entry has a reason and an
# `ignoreUntil` review date, after which the scan fails again. Re-check on every bump.

# PyPI (.github/tools/uv.lock: CI-only tools, never shipped or run by the harness). Semgrep 1.183
# pins these versions. Overriding them to the fixed releases makes `semgrep` crash on import.

[[IgnoredVulns]]
