# One package per plugin and one per profile bundle (ADR 0001).
packages:
  - plugins/*
  - bundles/*

# pnpm refuses to install a dependency with an unreviewed install script. These copy the
# decisions in dsh's own pnpm-workspace.yaml at the pinned tag.
allowBuilds:
  # PTY backend for dsh's shell and terminal tools.
  node-pty: true
  # Native FFI for durable JSONL writes.
  koffi: true
  # Restores the executable bit on node-pty's macOS spawn helper.
  '@deepseek-ai/dsh-subprocess-local': true
  # Pulled in by pi-ai; their scripts are no-ops dsh also denies.
  '@google/genai': false
  protobufjs: false

# dsh patches an O(n²) streaming bug in pi-ai 1.1.0 in its own workspace, but the
# published dsh-llm-pi-ai asks for ^1.1.0, so an npm install gets a newer pi-ai unpatched.
# We pin the version dsh tested and re-apply its patch, copied verbatim from the pinned tag
# (dsh-v0.2.1-rc.2). On every dsh upgrade, re-check both lines against dsh's pnpm-workspace.yaml.
overrides:
  '@earendil-works/pi-ai': 1.1.0
patchedDependencies:
  '@earendil-works/pi-ai@1.1.0': patches/@earendil-works__pi-ai@1.1.0.patch
