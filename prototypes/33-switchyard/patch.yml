# PROTOTYPE, throwaway (#33): the Switchyard preset as a hand-declared dsh route, via the logging proxy.
- id: llm-pi-ai
  config:
    providers:
      openrouter-preset:
        displayName: OpenRouter Switchyard preset (via logging proxy)
        api: openai-completions
        baseURL: http://127.0.0.1:18080/api/v1
        apiKeyEnv: OPENROUTER_API_KEY
        compat:
          cacheControlFormat: anthropic
        models:
          - id: "@preset/dsh-switchyard"
            contextWindow: 200000
            maxTokens: 8192
- id: agent-default-model
  config:
    provider: openrouter-preset
    model: "@preset/dsh-switchyard"
# No extra paid calls: no title model call, no web search, no DeepSeek log upload.
- id: session-title-llm
  disabled: true
- id: tool-web
  disabled: true
- id: session-log-deepseek
  disabled: true
