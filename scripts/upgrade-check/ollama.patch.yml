# Upgrade-check overlay: points the job profile's default model at local Ollama, so the
# smoke turn costs nothing and no remote model is reachable (no remote route, no key).
- id: llm-pi-ai
  config:
    providers:
      ollama:
        displayName: Ollama (local)
        api: openai-completions
        baseURL: http://127.0.0.1:11434/v1
        apiKeyEnv: OLLAMA_API_KEY
        models:
          - id: qwen3.5:2b
            contextWindow: 32768
            maxTokens: 4096

- id: agent-default-model
  config:
    provider: ollama
    model: qwen3.5:2b
